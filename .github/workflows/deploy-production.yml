name: Stage Production Candidate

on:
  workflow_dispatch:
    inputs:
      custom_launch_public_enablement:
        description: Require the detached Custom Launch release record and stage an enabled candidate
        required: true
        default: false
        type: boolean
      custom_launch_dark_release:
        description: Require the detached Custom Launch release record and stage a disabled dark candidate
        required: true
        default: false
        type: boolean
      custom_launch_release_record_commit_sha:
        description: Exact commit on command-center-release-records containing the detached record
        required: false
        default: ""
        type: string
      custom_launch_release_record_sha256:
        description: Canonical detached record SHA-256 printed by the verifier
        required: false
        default: ""
        type: string
      custom_launch_v3_release:
        description: Stage the exact Custom Launch API V3 release subject; never promotes or signs
        required: true
        default: false
        type: boolean
      custom_launch_v3_release_record_commit_sha:
        description: Exact commit containing release-records/custom-launch-v2/release-record.json
        required: false
        default: ""
        type: string
      custom_launch_v3_release_record_sha256:
        description: Canonical SHA-256 of the detached Custom Launch V2 release record
        required: false
        default: ""
        type: string
      custom_v2_registry_live:
        description: Require live Registry V2; otherwise follow reviewed configuration. This does not change configuration
        required: true
        default: false
        type: boolean
      custom_v2_generic_public_read_enabled:
        description: Require ready Generic V2 reads; otherwise follow production bindings. This does not activate them
        required: true
        default: false
        type: boolean
      custom_v2_detail_record_hash:
        description: Optional exact public Generic V2 record hash when a ready feed can be empty
        required: false
        default: ""
        type: string
      custom_v2_authenticated_ingress_evidence_sha256:
        description: Optional SHA-256 binding for protected short-lived Approval V3 PUT and GET evidence
        required: false
        default: ""
        type: string
      custom_v2_generic_signer_probe_expected_json:
        description: Canonical public two-Machine Generic signer probe contract; contains no credential
        required: false
        default: ""
        type: string
      custom_v2_generic_signer_probe_expected_sha256:
        description: Plain SHA-256 of the exact canonical public Generic signer probe contract
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: programmable-production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Consume exact full production Verify proof
    if: >-
      github.repository_id == 1314365508 &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production'
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_VERIFY_MODE: ${{ (inputs.custom_launch_v3_release || inputs.custom_v2_registry_live || inputs.custom_v2_generic_public_read_enabled || inputs.custom_v2_detail_record_hash != '' || inputs.custom_v2_authenticated_ingress_evidence_sha256 != '' || inputs.custom_v2_generic_signer_probe_expected_json != '' || inputs.custom_v2_generic_signer_probe_expected_sha256 != '') && 'custom-v2-release' || 'change' }}
    outputs:
      verified_sha: ${{ steps.verify-proof.outputs.verified_sha }}
      verified_tree: ${{ steps.verify-proof.outputs.verified_tree }}
      verify_run_id: ${{ steps.verify-proof.outputs.verify_run_id }}
      verify_run_attempt: ${{ steps.verify-proof.outputs.verify_run_attempt }}
      artifact_id: ${{ steps.resolve-proof.outputs.artifact_id }}
      proof_sha256: ${{ steps.verify-proof.outputs.proof_sha256 }}
      artifact_digest: ${{ steps.verify-proof.outputs.artifact_digest }}
      verified_contracts: ${{ steps.verify-proof.outputs.verified_contracts }}
      verified_custom_v2: ${{ steps.verify-proof.outputs.verified_custom_v2 }}
      verified_database: ${{ steps.verify-proof.outputs.verified_database }}
      verified_dependencies: ${{ steps.verify-proof.outputs.verified_dependencies }}
      verified_indexer: ${{ steps.verify-proof.outputs.verified_indexer }}
      verified_interface: ${{ steps.verify-proof.outputs.verified_interface }}
      verified_read_model: ${{ steps.verify-proof.outputs.verified_read_model }}
      verification_mode: ${{ steps.verify-proof.outputs.verification_mode }}
      verify_event: ${{ steps.verify-proof.outputs.verify_event }}

    steps:
      - name: Check out exact production commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Resolve latest exact full production Verify proof
        id: resolve-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/production-verify-proof.mjs resolve
          --repository-root "$GITHUB_WORKSPACE"
          --verification-mode "$PRODUCTION_VERIFY_MODE"
          --github-output "$GITHUB_OUTPUT"

      - name: Download exact immutable production Verify proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve-proof.outputs.artifact_id }}
          path: ${{ runner.temp }}/production-verify-proof
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-proof.outputs.verify_run_id }}
          digest-mismatch: error

      - name: Verify Sigstore provenance and exact proof contents
        id: verify-proof
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIGEST: ${{ steps.resolve-proof.outputs.artifact_digest }}
          VERIFY_RUN_ID: ${{ steps.resolve-proof.outputs.verify_run_id }}
          VERIFY_RUN_ATTEMPT: ${{ steps.resolve-proof.outputs.verify_run_attempt }}
          VERIFY_MODE: ${{ steps.resolve-proof.outputs.verification_mode }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/production-verify-proof/production-verify-proof.json"
          attestation_result="$RUNNER_TEMP/production-verify-attestation.json"
          test -f "$proof"
          gh attestation verify "$proof" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$attestation_result"
          ATTESTATION_RESULT="$attestation_result" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.env.ATTESTATION_RESULT, "utf8"));
            if (!Array.isArray(result) || result.length < 1) {
              throw new Error("No valid production Verify attestation was returned");
            }
          '
          node scripts/production-verify-proof.mjs verify \
            --repository-root "$GITHUB_WORKSPACE" \
            --proof "$proof" \
            --run-id "$VERIFY_RUN_ID" \
            --run-attempt "$VERIFY_RUN_ATTEMPT" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --verification-mode "$VERIFY_MODE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record consumed production Verify proof
        env:
          VERIFY_RUN_URL: ${{ steps.resolve-proof.outputs.verify_run_url }}
          PROOF_COMPLETED_AT: ${{ steps.resolve-proof.outputs.proof_completed_at }}
          PROOF_SHA256: ${{ steps.verify-proof.outputs.proof_sha256 }}
          ARTIFACT_DIGEST: ${{ steps.verify-proof.outputs.artifact_digest }}
          VERIFY_EVENT: ${{ steps.verify-proof.outputs.verify_event }}
          VERIFY_MODE: ${{ steps.verify-proof.outputs.verification_mode }}
        run: |
          {
            echo "## Consumed production Verify proof"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Verify run: $VERIFY_RUN_URL"
            echo "- Proof completed: \`$PROOF_COMPLETED_AT\`"
            echo "- Verification: \`$VERIFY_EVENT\` / \`$VERIFY_MODE\`"
            echo "- Proof SHA-256: \`$PROOF_SHA256\`"
            echo "- Immutable artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Custom V2 lane required: \`${{ steps.verify-proof.outputs.verified_custom_v2 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Stage programmable.market candidate
    needs: release-gate
    if: >-
      github.repository_id == 1314365508 &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production' &&
      needs.release-gate.outputs.verified_sha == github.sha
    permissions:
      actions: read
      attestations: write
      contents: read
      deployments: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      indexing_status: ${{ steps.index-reset-smoke.outputs.indexing_status }}
      public_routes_checked: ${{ steps.index-reset-smoke.outputs.public_routes_checked }}
      retired_operations_checked: ${{ steps.index-reset-smoke.outputs.retired_operations_checked }}
      provider_calls_expected: ${{ steps.index-reset-smoke.outputs.provider_calls_expected }}
      website_read_mode: ${{ steps.indexed-website-smoke.outputs.mode }}
      website_read_evidence_sha256: ${{ steps.indexed-website-smoke.outputs.evidence_sha256 }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out production
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-gate.outputs.verified_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm

      - name: Revalidate exact Verify proof after production approval
        id: revalidate-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/production-verify-proof.mjs resolve
          --repository-root "$GITHUB_WORKSPACE"
          --verification-mode "${{ needs.release-gate.outputs.verification_mode }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Confirm consumed Verify proof identity after production approval
        env:
          EXPECTED_SHA: ${{ needs.release-gate.outputs.verified_sha }}
          EXPECTED_TREE: ${{ needs.release-gate.outputs.verified_tree }}
          EXPECTED_RUN_ID: ${{ needs.release-gate.outputs.verify_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.release-gate.outputs.verify_run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ needs.release-gate.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.release-gate.outputs.artifact_digest }}
          EXPECTED_VERIFY_EVENT: ${{ needs.release-gate.outputs.verify_event }}
          EXPECTED_VERIFY_MODE: ${{ needs.release-gate.outputs.verification_mode }}
          REVALIDATED_SHA: ${{ steps.revalidate-proof.outputs.verified_sha }}
          REVALIDATED_TREE: ${{ steps.revalidate-proof.outputs.verified_tree }}
          REVALIDATED_RUN_ID: ${{ steps.revalidate-proof.outputs.verify_run_id }}
          REVALIDATED_RUN_ATTEMPT: ${{ steps.revalidate-proof.outputs.verify_run_attempt }}
          REVALIDATED_ARTIFACT_ID: ${{ steps.revalidate-proof.outputs.artifact_id }}
          REVALIDATED_ARTIFACT_DIGEST: ${{ steps.revalidate-proof.outputs.artifact_digest }}
          REVALIDATED_VERIFY_EVENT: ${{ steps.revalidate-proof.outputs.verify_event }}
          REVALIDATED_VERIFY_MODE: ${{ steps.revalidate-proof.outputs.verification_mode }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$REVALIDATED_SHA" = "$EXPECTED_SHA"
          test "$REVALIDATED_TREE" = "$EXPECTED_TREE"
          test "$REVALIDATED_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$REVALIDATED_RUN_ATTEMPT" = "$EXPECTED_RUN_ATTEMPT"
          test "$REVALIDATED_ARTIFACT_ID" = "$EXPECTED_ARTIFACT_ID"
          test "$REVALIDATED_ARTIFACT_DIGEST" = "$EXPECTED_ARTIFACT_DIGEST"
          test "$REVALIDATED_VERIFY_EVENT" = "$EXPECTED_VERIFY_EVENT"
          test "$REVALIDATED_VERIFY_MODE" = "$EXPECTED_VERIFY_MODE"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@54.1.0

      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Bind staged production environment metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/vercel-production-env-metadata.json"
          test ! -e "$metadata_file"
          vercel env ls production --format json --token="$VERCEL_TOKEN" |
            node scripts/bind-vercel-sensitive-production-metadata.mjs \
              --metadata-file "$metadata_file" \
              --vercel-project-id "$VERCEL_PROJECT_ID"

      - name: Resolve Custom V2 expectations before deployment
        id: custom-v2-policy
        if: needs.release-gate.outputs.verified_custom_v2 == 'true'
        env:
          REQUESTED_REGISTRY_LIVE: ${{ inputs.custom_v2_registry_live }}
          REQUESTED_GENERIC_READY: ${{ inputs.custom_v2_generic_public_read_enabled }}
        run: >-
          node scripts/resolve-custom-v2-staging-policy.mjs
          --deployment-file config/custom-registry-v2.deployment.prelaunch.json
          --metadata-file "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --project-id "$VERCEL_PROJECT_ID"
          --registry-live "$REQUESTED_REGISTRY_LIVE"
          --generic-ready "$REQUESTED_GENERIC_READY"
          --github-output "$GITHUB_OUTPUT"

      - name: Validate staged legacy Explore API reset policy
        id: read-model-policy
        run: >-
          npm run perf:read-model:deploy-policy --
          --env-file .vercel/.env.production.local
          --sensitive-env-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Validate indexed website read policy
        id: indexed-website-policy
        run: >-
          npm run perf:indexed-website:deploy-policy --
          --env-file .vercel/.env.production.local
          --sensitive-env-metadata "$RUNNER_TEMP/vercel-production-env-metadata.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Reject mixed legacy and V3 Custom Launch release authority
        if: >-
          inputs.custom_launch_v3_release &&
          (inputs.custom_launch_public_enablement || inputs.custom_launch_dark_release)
        run: |
          echo "The V3 release record cannot be combined with the retired V1 release lane" >&2
          exit 1

      - name: Require the exact Custom V2 production Verify lane for V3
        if: >-
          inputs.custom_launch_v3_release &&
          needs.release-gate.outputs.verified_custom_v2 != 'true'
        run: |
          echo "Custom Launch V3 requires the exact Custom V2 production Verify proof" >&2
          exit 1

      - name: Resolve Custom Launch release-record policy
        id: custom-launch-policy
        env:
          CUSTOM_LAUNCH_PUBLIC_ENABLEMENT_REQUESTED: ${{ inputs.custom_launch_public_enablement }}
          CUSTOM_LAUNCH_DARK_RELEASE_REQUESTED: ${{ inputs.custom_launch_dark_release }}
          CUSTOM_LAUNCH_PRODUCTION_MODE: ${{ vars.CUSTOM_LAUNCH_PRODUCTION_MODE }}
        run: >-
          node scripts/resolve-custom-launch-staging-policy.mjs
          --env-file .vercel/.env.production.local
          --requested "$CUSTOM_LAUNCH_PUBLIC_ENABLEMENT_REQUESTED"
          --dark-release-requested "$CUSTOM_LAUNCH_DARK_RELEASE_REQUESTED"
          --production-mode "$CUSTOM_LAUNCH_PRODUCTION_MODE"
          --github-output "$GITHUB_OUTPUT"

      - name: Capture current production rollback target
        id: production-before
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npm run perf:read-model:production-binding --
          --target-url "https://programmable.market"
          --reject-git-head "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify detached Custom Launch release record
        id: custom-launch-record
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_release_record_commit_sha }}
          RECORD_VERIFICATION_LEVEL: ${{ steps.custom-launch-policy.outputs.release_record_verification_level }}
          EXPECTED_RECORD_SHA256: ${{ inputs.custom_launch_release_record_sha256 }}
          EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          EXPECTED_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA: ${{ vars.PROGRAMMABLE_BACKEND_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA }}
          EXPECTED_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256: ${{ vars.PROGRAMMABLE_BACKEND_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256 }}
          PROGRAMMABLE_BACKEND_RELEASE_READ_TOKEN: ${{ secrets.PROGRAMMABLE_BACKEND_RELEASE_READ_TOKEN }}
          COMMAND_CENTER_GITHUB_TOKEN: ${{ github.token }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          ROLLBACK_DEPLOYMENT_URL: ${{ steps.production-before.outputs.deployment_url }}
          ROLLBACK_WEBSITE_COMMIT_SHA: ${{ steps.production-before.outputs.git_head }}
        run: |
          set -euo pipefail
          if [[ ! "$RECORD_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Custom Launch requires one exact detached-record commit" >&2
            exit 1
          fi
          if [[ "$RECORD_COMMIT_SHA" == "$GITHUB_SHA" ]]; then
            echo "The detached record must not be stored in its Website subject commit" >&2
            exit 1
          fi
          case "$RECORD_VERIFICATION_LEVEL" in
            staging|dark-staging) ;;
            *)
              echo "Custom Launch release-record verification level is invalid" >&2
              exit 1
              ;;
          esac
          record_ref="refs/remotes/origin/command-center-release-records"
          record_path="release-records/custom-launch-v1/release-record.json"
          record_file="$RUNNER_TEMP/custom-launch-release-record.json"
          test ! -e "$record_file"
          umask 077
          git fetch --no-tags origin \
            "+refs/heads/command-center-release-records:$record_ref"
          git cat-file -e "$RECORD_COMMIT_SHA^{commit}"
          git merge-base --is-ancestor \
            "$RECORD_COMMIT_SHA" "refs/remotes/origin/command-center-release-records"
          record_author_email="$(git show -s --format=%ae "$RECORD_COMMIT_SHA")"
          if [[ ! "$record_author_email" =~ ^309941960\+[A-Za-z0-9-]+@users\.noreply\.github\.com$ ]]; then
            echo "The detached record author is not the Programmable service account" >&2
            exit 1
          fi
          record_commit_json="$RUNNER_TEMP/custom-launch-release-record-commit.json"
          test ! -e "$record_commit_json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $COMMAND_CENTER_GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$record_commit_json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$RECORD_COMMIT_SHA"
          RECORD_COMMIT_JSON="$record_commit_json" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const commit = JSON.parse(readFileSync(process.env.RECORD_COMMIT_JSON, "utf8"));
          if (
            commit.sha !== process.env.RECORD_COMMIT_SHA ||
            commit.author?.id !== 309941960 ||
            commit.author?.login !== "programmable-infra" ||
            commit.committer?.id !== 309941960 ||
            commit.committer?.login !== "programmable-infra" ||
            commit.commit?.verification?.verified !== true
          ) {
            throw new Error("detached record commit lacks verified Programmable provenance");
          }
          NODE
          git show "$RECORD_COMMIT_SHA:$record_path" > "$record_file"
          attestation_summary_file="$RUNNER_TEMP/custom-launch-cross-repository-attestation.json"
          test ! -e "$attestation_summary_file"
          node scripts/verify-custom-launch-release-record.mjs "$record_file" \
            --require "$RECORD_VERIFICATION_LEVEL" \
            --verify-cross-repository-attestation \
            --cross-repository-attestation-summary "$attestation_summary_file" \
            --expect-website-commit "$GITHUB_SHA" \
            --expect-package-artifact-hash "$EXPECTED_PACKAGE_ARTIFACT_HASH" \
            --expect-cross-repository-attestation-commit "$EXPECTED_CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA" \
            --expect-cross-repository-binding-document-sha256 "$EXPECTED_CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256" \
            --expect-rollback-deployment-id "$ROLLBACK_DEPLOYMENT_ID" \
            --expect-rollback-deployment-url "$ROLLBACK_DEPLOYMENT_URL" \
            --expect-rollback-website-commit "$ROLLBACK_WEBSITE_COMMIT_SHA" \
            --expect-detached-record-sha256 "$EXPECTED_RECORD_SHA256" \
            --github-output "$GITHUB_OUTPUT"

      - name: Preserve detached Custom Launch release record
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/custom-launch-release-record.json
            ${{ runner.temp }}/custom-launch-cross-repository-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify detached Custom Launch V3 release record
        id: custom-launch-v3-record
        if: inputs.custom_launch_v3_release
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_v3_release_record_commit_sha }}
          EXPECTED_RECORD_SHA256: ${{ inputs.custom_launch_v3_release_record_sha256 }}
          EXPECTED_API_ATTESTATION_COMMIT_SHA: ${{ vars.PROGRAMMABLE_CUSTOM_LAUNCH_API_RELEASE_ATTESTATION_COMMIT_SHA }}
          EXPECTED_API_BINDING_DOCUMENT_SHA256: ${{ vars.PROGRAMMABLE_CUSTOM_LAUNCH_API_RELEASE_BINDING_DOCUMENT_SHA256 }}
          PROGRAMMABLE_CUSTOM_LAUNCH_API_RELEASE_READ_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_API_RELEASE_READ_TOKEN }}
          COMMAND_CENTER_GITHUB_TOKEN: ${{ github.token }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          ROLLBACK_DEPLOYMENT_URL: ${{ steps.production-before.outputs.deployment_url }}
          ROLLBACK_WEBSITE_COMMIT_SHA: ${{ steps.production-before.outputs.git_head }}
        run: |
          set -euo pipefail
          if [[ ! "$RECORD_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Custom Launch V3 requires one exact detached-record commit" >&2
            exit 1
          fi
          if [[ "$RECORD_COMMIT_SHA" == "$GITHUB_SHA" ]]; then
            echo "The detached record must not be stored in its Website subject commit" >&2
            exit 1
          fi
          record_ref="refs/remotes/origin/command-center-release-records"
          record_path="release-records/custom-launch-v2/release-record.json"
          record_file="$RUNNER_TEMP/custom-launch-v3-release-record.json"
          api_summary="$RUNNER_TEMP/custom-launch-v3-api-release-observation.json"
          test ! -e "$record_file"
          test ! -e "$api_summary"
          umask 077
          git fetch --no-tags origin \
            "+refs/heads/command-center-release-records:$record_ref"
          git cat-file -e "$RECORD_COMMIT_SHA^{commit}"
          git merge-base --is-ancestor "$RECORD_COMMIT_SHA" "$record_ref"
          record_author_email="$(git show -s --format=%ae "$RECORD_COMMIT_SHA")"
          if [[ ! "$record_author_email" =~ ^309941960\+[A-Za-z0-9-]+@users\.noreply\.github\.com$ ]]; then
            echo "The detached V3 record author is not the Programmable service account" >&2
            exit 1
          fi
          record_commit_json="$RUNNER_TEMP/custom-launch-v3-release-record-commit.json"
          test ! -e "$record_commit_json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $COMMAND_CENTER_GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$record_commit_json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$RECORD_COMMIT_SHA"
          RECORD_COMMIT_JSON="$record_commit_json" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const commit = JSON.parse(readFileSync(process.env.RECORD_COMMIT_JSON, "utf8"));
          if (
            commit.sha !== process.env.RECORD_COMMIT_SHA
            || commit.author?.id !== 309941960
            || commit.author?.login !== "programmable-infra"
            || commit.committer?.id !== 309941960
            || commit.committer?.login !== "programmable-infra"
            || commit.commit?.verification?.verified !== Boolean(true)
          ) throw new Error("detached V3 record commit lacks verified Programmable provenance");
          NODE
          git show "$RECORD_COMMIT_SHA:$record_path" > "$record_file"
          node scripts/verify-custom-launch-release-record-v2.mjs "$record_file" \
            --require staging \
            --verify-api-release-binding \
            --api-release-summary "$api_summary" \
            --expect-website-commit "$GITHUB_SHA" \
            --expect-website-tree "${{ needs.release-gate.outputs.verified_tree }}" \
            --expect-api-attestation-commit "$EXPECTED_API_ATTESTATION_COMMIT_SHA" \
            --expect-api-binding-document-sha256 "$EXPECTED_API_BINDING_DOCUMENT_SHA256" \
            --expect-rollback-deployment-id "$ROLLBACK_DEPLOYMENT_ID" \
            --expect-rollback-deployment-url "$ROLLBACK_DEPLOYMENT_URL" \
            --expect-rollback-website-commit "$ROLLBACK_WEBSITE_COMMIT_SHA" \
            --expect-detached-record-sha256 "$EXPECTED_RECORD_SHA256" \
            --github-output "$GITHUB_OUTPUT"
          echo "record_path=$record_file" >> "$GITHUB_OUTPUT"
          echo "api_release_summary_path=$api_summary" >> "$GITHUB_OUTPUT"

      - name: Set up Fly CLI for read-only release verification
        if: inputs.custom_launch_v3_release
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Verify exact Custom Launch API Fly release
        id: custom-launch-v3-fly
        if: inputs.custom_launch_v3_release
        env:
          FLY_API_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_API_FLY_READ_TOKEN }}
          EXPECTED_RELEASE_VERSION: ${{ steps.custom-launch-v3-record.outputs.api_fly_release_version }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.custom-launch-v3-record.outputs.api_image_digest }}
          EXPECTED_IMAGE_TAG: ${{ steps.custom-launch-v3-record.outputs.api_image_tag }}
          EXPECTED_MACHINE_COUNT: ${{ steps.custom-launch-v3-record.outputs.api_machine_count }}
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/custom-launch-v3-fly-releases.json"
          machines="$RUNNER_TEMP/custom-launch-v3-fly-machines.json"
          images="$RUNNER_TEMP/custom-launch-v3-fly-images.json"
          evidence="$RUNNER_TEMP/custom-launch-v3-fly-readback.json"
          flyctl releases --app programmable-custom-launch-api --json > "$releases"
          flyctl machine list --app programmable-custom-launch-api --json > "$machines"
          flyctl image show --app programmable-custom-launch-api --json > "$images"
          node scripts/verify-custom-launch-api-fly-release.mjs \
            --releases "$releases" \
            --machines "$machines" \
            --images "$images" \
            --expected-release-version "$EXPECTED_RELEASE_VERSION" \
            --expected-image-digest "$EXPECTED_IMAGE_DIGEST" \
            --expected-image-tag "$EXPECTED_IMAGE_TAG" \
            --expected-machine-count "$EXPECTED_MACHINE_COUNT" \
            --output "$evidence"
          echo "evidence_path=$evidence" >> "$GITHUB_OUTPUT"

      - name: Preserve exact Custom Launch V3 release gate
        if: inputs.custom_launch_v3_release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-v3-release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.custom-launch-v3-record.outputs.record_path }}
            ${{ steps.custom-launch-v3-record.outputs.api_release_summary_path }}
            ${{ steps.custom-launch-v3-fly.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Record Custom Launch release gate
        if: steps.custom-launch-policy.outputs.release_record_required == 'true'
        env:
          RECORD_COMMIT_SHA: ${{ inputs.custom_launch_release_record_commit_sha }}
        run: |
          {
            echo "## Custom Launch release record"
            echo
            echo "- Record commit: \`$RECORD_COMMIT_SHA\`"
            echo "- Release subject: \`${{ steps.custom-launch-record.outputs.release_subject_sha256 }}\`"
            echo "- Detached record: \`${{ steps.custom-launch-record.outputs.detached_record_sha256 }}\`"
            echo "- Backend cross-repository attestation: \`${{ steps.custom-launch-record.outputs.cross_repository_attestation_commit_sha }}\`"
            echo "- Backend binding document: \`${{ steps.custom-launch-record.outputs.cross_repository_binding_document_sha256 }}\`"
            echo "- Review authority: \`${{ steps.custom-launch-record.outputs.review_authority_mode }}\`"
            echo "- Gate: \`${{ steps.custom-launch-policy.outputs.release_record_verification_level }}\` only"
            echo "- Stage mode: \`${{ steps.custom-launch-policy.outputs.staging_mode }}\`"
            echo
            echo "No promotion is authorized by this staging gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile all residual Generic signer probes before new authority
        id: generic-signer-probe-preflight
        if: >-
          needs.release-gate.outputs.verified_custom_v2 == 'true' &&
          inputs.custom_v2_generic_public_read_enabled
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          node scripts/reconcile-generic-signer-probe-deployments.mjs
          --scope all-project-probes
          --output "$RUNNER_TEMP/generic-signer-probe-reconciliation-preflight.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve pre-mutation Generic signer probe reconciliation
        id: generic-signer-probe-preflight-record
        if: steps.generic-signer-probe-preflight.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generic-signer-probe-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.generic-signer-probe-preflight.outputs.reconciliation_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Prepare one-shot Generic signer probe authority
        id: generic-signer-probe-authority
        if: steps.generic-signer-probe-preflight-record.outcome == 'success'
        env:
          EXPECTED_JSON: ${{ inputs.custom_v2_generic_signer_probe_expected_json }}
          EXPECTED_SHA256: ${{ inputs.custom_v2_generic_signer_probe_expected_sha256 }}
        run: |
          set -euo pipefail
          contract_path="$RUNNER_TEMP/generic-signer-probe-expected.json"
          secret_path="$RUNNER_TEMP/generic-signer-probe-secret"
          operation_record_path="$RUNNER_TEMP/generic-signer-probe-operation.json"
          CONTRACT_PATH="$contract_path" SECRET_PATH="$secret_path" \
          OPERATION_RECORD_PATH="$operation_record_path" \
            node --input-type=module <<'NODE'
          import { createHash, randomBytes } from "node:crypto";
          import { writeFileSync } from "node:fs";
          const canonical = (value) => {
            if (value === null || ["boolean", "number", "string"].includes(typeof value)) {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
            return `{${Object.keys(value).sort().map((key) =>
              `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
          };
          const source = (process.env.EXPECTED_JSON ?? "").trim();
          const expected = process.env.EXPECTED_SHA256 ?? "";
          const digest = `sha256:${createHash("sha256")
            .update(source, "utf8").digest("hex")}`;
          if (!/^sha256:[0-9a-f]{64}$/u.test(expected) || digest !== expected) {
            throw new Error("Generic signer probe contract digest is invalid");
          }
          const value = JSON.parse(source);
          if (value?.schemaVersion !==
              "programmable.website-generic-launch-read-stage-probe-expected.v1") {
            throw new Error("Generic signer probe contract schema is invalid");
          }
          if (source !== canonical(value)) {
            throw new Error("Generic signer probe contract is not canonical");
          }
          const runId = process.env.GITHUB_RUN_ID;
          const runAttempt = process.env.GITHUB_RUN_ATTEMPT;
          const headSha = process.env.GITHUB_SHA;
          const projectId = process.env.VERCEL_PROJECT_ID;
          if (!/^[0-9]{1,20}$/u.test(runId ?? "")
            || !/^[1-9][0-9]{0,5}$/u.test(runAttempt ?? "")
            || !/^[0-9a-f]{40}$/u.test(headSha ?? "")
            || !/^prj_[A-Za-z0-9]{20,80}$/u.test(projectId ?? "")
            || !/^[0-9a-f]{32}$/u.test(value.operationId ?? "")) {
            throw new Error("Generic signer probe recovery identity is invalid");
          }
          const recoveryId = `${value.operationId}.${runId}.${runAttempt}.${headSha}`;
          const operationRecord = {
            schemaVersion:
              "programmable.website-generic-launch-read-stage-probe-operation.v1",
            status: "prepared",
            recoveryId,
            operationId: value.operationId,
            sourceCommit: value.sourceCommit,
            sourceTree: value.sourceTree,
            websiteHead: headSha,
            projectId,
            workflowAuthority: {
              repositoryId: "1314365508",
              workflowPath: ".github/workflows/deploy-production.yml",
              runId,
              runAttempt,
              environment: "production",
            },
          };
          writeFileSync(process.env.CONTRACT_PATH, source, {
            flag: "wx", mode: 0o600,
          });
          const secret = randomBytes(32).toString("hex");
          writeFileSync(process.env.SECRET_PATH, secret, {
            flag: "wx", mode: 0o600,
          });
          writeFileSync(
            process.env.OPERATION_RECORD_PATH,
            `${canonical(operationRecord)}\n`,
            { flag: "wx", mode: 0o600 },
          );
          process.stdout.write(`::add-mask::${secret}\n`);
          process.stdout.write(`recovery_id=${recoveryId}\n`);
          NODE
          echo "contract_path=$contract_path" >> "$GITHUB_OUTPUT"
          echo "secret_path=$secret_path" >> "$GITHUB_OUTPUT"
          echo "operation_record_path=$operation_record_path" >> "$GITHUB_OUTPUT"
          operation_record_sha256="$(shasum -a 256 "$operation_record_path" | awk '{print $1}')"
          echo "operation_record_sha256=sha256:$operation_record_sha256" >> "$GITHUB_OUTPUT"
          recovery_id="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const value = JSON.parse(readFileSync(process.argv[1], "utf8"));
            process.stdout.write(value.recoveryId);
          ' "$operation_record_path")"
          echo "recovery_id=$recovery_id" >> "$GITHUB_OUTPUT"

      - name: Preserve pre-mutation Generic signer probe operation record
        id: generic-signer-probe-operation-record
        if: steps.generic-signer-probe-authority.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generic-signer-probe-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.generic-signer-probe-authority.outputs.operation_record_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Deploy one-shot unaliased Generic signer probe candidate
        id: generic-signer-probe-deploy
        if: steps.generic-signer-probe-operation-record.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROBE_RECOVERY_ID: ${{ steps.generic-signer-probe-authority.outputs.recovery_id }}
        run: |
          set -euo pipefail
          probe_secret="$(<"${{ steps.generic-signer-probe-authority.outputs.secret_path }}")"
          probe_contract="$(<"${{ steps.generic-signer-probe-authority.outputs.contract_path }}")"
          deployment_url="$(vercel deploy --prod --skip-domain --archive=tgz \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta programmableGenericSignerProbe=one-shot-v1 \
            --meta programmableRepositoryId=1314365508 \
            --meta programmableGenericSignerProbeRecoveryId="$PROBE_RECOVERY_ID" \
            --env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" \
            --env PROGRAMMABLE_RELEASE_COMMIT_SHA="$GITHUB_SHA" \
            --env PROGRAMMABLE_GENERIC_LAUNCH_SIGNER_PROBE_TOKEN="$probe_secret" \
            --env PROGRAMMABLE_GENERIC_LAUNCH_SIGNER_PROBE_EXPECTED_V1_JSON="$probe_contract" \
            --token="$VERCEL_TOKEN")"
          case "$deployment_url" in https://*.vercel.app) ;; *) exit 1 ;; esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Resolve exact one-shot Generic signer probe deployment
        id: generic-signer-probe-deployment
        if: steps.generic-signer-probe-deploy.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.generic-signer-probe-deploy.outputs.url }}
        run: >-
          npm run perf:read-model:staged-deployment --
          --target-url "$DEPLOYMENT_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Prove both exact Generic signer Machines from Vercel OIDC
        id: generic-signer-probe
        if: steps.generic-signer-probe-deployment.outcome == 'success'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROBE_TARGET_URL: ${{ steps.generic-signer-probe-deployment.outputs.target_url }}
          PROBE_DEPLOYMENT_ID: ${{ steps.generic-signer-probe-deployment.outputs.deployment_id }}
          EXPECTED_SHA256: ${{ inputs.custom_v2_generic_signer_probe_expected_sha256 }}
        run: |
          set -euo pipefail
          export PROGRAMMABLE_GENERIC_LAUNCH_SIGNER_PROBE_TOKEN="$(<"${{ steps.generic-signer-probe-authority.outputs.secret_path }}")"
          export PROGRAMMABLE_GENERIC_LAUNCH_SIGNER_PROBE_EXPECTED_V1_JSON="$(<"${{ steps.generic-signer-probe-authority.outputs.contract_path }}")"
          output_directory="$RUNNER_TEMP/generic-signer-probe-receipts"
          npm run probe:custom-v2:signer-stage -- \
            --target-url "$PROBE_TARGET_URL" \
            --deployment-id "$PROBE_DEPLOYMENT_ID" \
            --git-head "$GITHUB_SHA" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --output-directory "$output_directory"
          echo "receipt_directory=$output_directory" >> "$GITHUB_OUTPUT"

      - name: Reconcile every secret-bearing Generic signer probe deployment
        id: generic-signer-probe-delete
        if: >-
          always() &&
          steps.generic-signer-probe-authority.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROBE_RECOVERY_ID: ${{ steps.generic-signer-probe-authority.outputs.recovery_id }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.generic-signer-probe-deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/generic-signer-probe-reconciliation-main.json"
          args=(
            --recovery-id "$PROBE_RECOVERY_ID"
            --website-head "$GITHUB_SHA"
            --output "$output"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$EXPECTED_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]{20,80}$ ]]; then
            args+=(--expected-deployment-id "$EXPECTED_DEPLOYMENT_ID")
          fi
          node scripts/reconcile-generic-signer-probe-deployments.mjs "${args[@]}"

      - name: Remove local Generic signer probe credential
        if: >-
          always() &&
          steps.generic-signer-probe-authority.outcome == 'success'
        env:
          SECRET_PATH: ${{ steps.generic-signer-probe-authority.outputs.secret_path }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { lstatSync, unlinkSync } from "node:fs";
          import { resolve } from "node:path";
          const runnerTemp = `${resolve(process.env.RUNNER_TEMP)}/`;
          const target = resolve(process.env.SECRET_PATH);
          if (!target.startsWith(runnerTemp) || !lstatSync(target).isFile()) {
            throw new Error("probe credential path is not an exact runner file");
          }
          unlinkSync(target);
          NODE

      - name: Stage production source build without assigning domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prod --skip-domain --archive=tgz \
            --meta githubCommitSha="$GITHUB_SHA" \
            --env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" \
            --env PROGRAMMABLE_RELEASE_COMMIT_SHA="$GITHUB_SHA" \
            --token="$VERCEL_TOKEN")"
          case "$deployment_url" in
            https://*) ;;
            *)
              echo "Vercel did not return a deployment URL" >&2
              exit 1
              ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Resolve exact staged deployment
        id: staged-deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          npm run perf:read-model:staged-deployment --
          --target-url "$DEPLOYMENT_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Probe staged token image runtime without writes
        env:
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readBoundedResponseText } from "./scripts/read-bounded-response.mjs";

          const response = await fetch(new URL(
            "/api/token-image",
            process.env.STAGED_TARGET_URL,
          ), {
            method: "POST",
            redirect: "error",
            headers: {
              accept: "application/json",
              "x-vercel-protection-bypass":
                process.env.VERCEL_AUTOMATION_BYPASS_SECRET,
              "x-vercel-set-bypass-cookie": "false",
            },
            signal: AbortSignal.timeout(30_000),
          });
          const contentType = response.headers.get("content-type")
            ?.split(";", 1)[0]?.trim().toLowerCase();
          if (contentType !== "application/json") {
            await response.body?.cancel("unexpected content type").catch(() => {});
            throw new Error("staged token image runtime did not return JSON");
          }
          const body = JSON.parse(await readBoundedResponseText(response, {
            maximumBytes: 65_536,
            label: "staged token image runtime response",
          }));
          if (
            response.status !== 401
            || body === null
            || Array.isArray(body)
            || typeof body !== "object"
            || Object.keys(body).length !== 1
            || body.error !== "Connect your wallet and try again"
          ) throw new Error("staged token image runtime contract is invalid");
          NODE

      - name: Probe exact staged Custom Launch V3 release
        id: custom-launch-v3-stage
        if: inputs.custom_launch_v3_release
        env:
          PROGRAMMABLE_CUSTOM_LAUNCH_V3_CANARY_API_KEY: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_V3_CANARY_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/custom-launch-v3-stage-evidence.json"
          node scripts/probe-custom-launch-v3-release.mjs \
            --website-url "${{ steps.staged-deployment.outputs.target_url }}" \
            --website-deployment-id "${{ steps.staged-deployment.outputs.deployment_id }}" \
            --expected-website-commit "$GITHUB_SHA" \
            --api-release-summary "${{ steps.custom-launch-v3-record.outputs.api_release_summary_path }}" \
            --output "$evidence"
          echo "evidence_path=$evidence" >> "$GITHUB_OUTPUT"
          evidence_sha256="$(node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            process.stdout.write(`sha256:${createHash("sha256")
              .update(readFileSync(process.argv[1])).digest("hex")}`);
          ' "$evidence")"
          echo "evidence_sha256=$evidence_sha256" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted Custom Launch V3 staged evidence
        if: inputs.custom_launch_v3_release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-v3-stage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-v3-stage.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90


      - name: Prove clean candidate carries no Generic signer probe authority
        id: generic-signer-probe-clean
        if: steps.generic-signer-probe-delete.outcome == 'success'
        env:
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { readBoundedResponseText } from "./scripts/read-bounded-response.mjs";
          const response = await fetch(new URL(
            "/api/ops/custom-launch/generic-v2-signer-probe",
            process.env.STAGED_TARGET_URL,
          ), {
            method: "POST",
            redirect: "error",
            headers: {
              "content-type": "application/json",
              "x-vercel-protection-bypass":
                process.env.VERCEL_AUTOMATION_BYPASS_SECRET,
              "x-vercel-set-bypass-cookie": "false",
            },
            body: "{}",
            signal: AbortSignal.timeout(30_000),
          });
          if (!response.headers.get("content-type")?.toLowerCase()
            .startsWith("application/json")) {
            await response.body?.cancel("unexpected content type").catch(() => {});
            throw new Error("clean candidate signer probe did not return JSON");
          }
          const body = JSON.parse(await readBoundedResponseText(response, {
            maximumBytes: 65_536,
            label: "clean candidate signer probe response",
          }));
          if (response.status !== 503
            || body?.schemaVersion !==
              "programmable.generic-launch-signer-probe-error.v1"
            || body?.code !== "probe_unavailable") {
            throw new Error("clean candidate signer probe is not disabled");
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            `status=503\ncode=probe_unavailable\nobserved_at=${new Date().toISOString()}\n`);
          NODE

      - name: Reject Custom V2 matrix outside a verified Custom V2 change
        if: >-
          needs.release-gate.outputs.verified_custom_v2 != 'true' &&
          (inputs.custom_v2_registry_live ||
          inputs.custom_v2_generic_public_read_enabled ||
          inputs.custom_v2_detail_record_hash != '' ||
          inputs.custom_v2_authenticated_ingress_evidence_sha256 != '')
        run: |
          echo "Custom V2 stage inputs require the exact Custom V2 production Verify lane" >&2
          exit 1

      - name: Gate exact unaliased Custom V2 staged candidate
        id: custom-v2-stage
        if: needs.release-gate.outputs.verified_custom_v2 == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PROGRAMMABLE_CUSTOM_V2_STAGE_AUTHENTICATED_EVIDENCE_V1_JSON: ${{ secrets.PROGRAMMABLE_CUSTOM_V2_STAGE_AUTHENTICATED_EVIDENCE_V1_JSON }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          EXPECTED_GIT_HEAD: ${{ github.sha }}
          REGISTRY_MODE: ${{ steps.custom-v2-policy.outputs.registry_mode }}
          GENERIC_MODE: ${{ steps.custom-v2-policy.outputs.generic_mode }}
          DETAIL_RECORD_HASH: ${{ inputs.custom_v2_detail_record_hash }}
          AUTHENTICATED_INGRESS_EVIDENCE_SHA256: ${{ inputs.custom_v2_authenticated_ingress_evidence_sha256 }}
        run: |
          set -euo pipefail
          evidence_path="$RUNNER_TEMP/custom-v2-stage-evidence.json"
          args=(
            --target-url "$STAGED_TARGET_URL"
            --deployment-id "$STAGED_DEPLOYMENT_ID"
            --git-head "$EXPECTED_GIT_HEAD"
            --registry-mode "$REGISTRY_MODE"
            --generic-mode "$GENERIC_MODE"
            --evidence-output "$evidence_path"
          )
          if [ -n "$DETAIL_RECORD_HASH" ]; then
            args+=(--detail-record-hash "$DETAIL_RECORD_HASH")
          fi
          if [ -n "$AUTHENTICATED_INGRESS_EVIDENCE_SHA256" ]; then
            args+=(
              --authenticated-ingress-evidence-sha256
              "$AUTHENTICATED_INGRESS_EVIDENCE_SHA256"
            )
          fi
          vercel env run -e production --token="$VERCEL_TOKEN" -- \
            npm run probe:custom-v2:stage -- "${args[@]}"
          evidence_sha256="$(node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            process.stdout.write(`sha256:${createHash("sha256")
              .update(readFileSync(process.argv[1])).digest("hex")}`);
          ' "$evidence_path")"
          echo "evidence_path=$evidence_path" >> "$GITHUB_OUTPUT"
          echo "evidence_sha256=$evidence_sha256" >> "$GITHUB_OUTPUT"

      - name: Preserve exact Custom V2 staged evidence
        if: needs.release-gate.outputs.verified_custom_v2 == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-v2-stage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-v2-stage.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Create canonical Generic signer probe cleanup bundle
        id: generic-signer-probe-bundle
        if: >-
          steps.generic-signer-probe-clean.outcome == 'success' &&
          steps.custom-v2-stage.outcome == 'success'
        env:
          EXPECTED_CONTRACT_PATH: ${{ steps.generic-signer-probe-authority.outputs.contract_path }}
          RECEIPT_DIRECTORY: ${{ steps.generic-signer-probe.outputs.receipt_directory }}
          RECOVERY_ID: ${{ steps.generic-signer-probe-authority.outputs.recovery_id }}
          OPERATION_RECORD_ARTIFACT_ID: ${{ steps.generic-signer-probe-operation-record.outputs.artifact-id }}
          OPERATION_RECORD_ARTIFACT_DIGEST: ${{ steps.generic-signer-probe-operation-record.outputs.artifact-digest }}
          OPERATION_RECORD_SHA256: ${{ steps.generic-signer-probe-authority.outputs.operation_record_sha256 }}
          RECONCILIATION_PATH: ${{ steps.generic-signer-probe-delete.outputs.reconciliation_path }}
          PROBE_DEPLOYMENT_ID: ${{ steps.generic-signer-probe-deployment.outputs.deployment_id }}
          PROBE_TARGET_URL: ${{ steps.generic-signer-probe-deployment.outputs.target_url }}
          CLEAN_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          CLEAN_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          CLEAN_ROUTE_STATUS: ${{ steps.generic-signer-probe-clean.outputs.status }}
          CLEAN_ROUTE_CODE: ${{ steps.generic-signer-probe-clean.outputs.code }}
          CLEAN_OBSERVED_AT: ${{ steps.generic-signer-probe-clean.outputs.observed_at }}
        run: |
          set -euo pipefail
          bundle_path="$RUNNER_TEMP/generic-signer-probe-bundle.json"
          BUNDLE_PATH="$bundle_path" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          const canonical = (value) => {
            if (value === null || ["boolean", "number", "string"].includes(typeof value)) {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
            return `{${Object.keys(value).sort().map((key) =>
              `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
          };
          const sha256 = (bytes) => `sha256:${createHash("sha256")
            .update(bytes).digest("hex")}`;
          const expected = JSON.parse(readFileSync(
            process.env.EXPECTED_CONTRACT_PATH,
            "utf8",
          ));
          const reconciliation = JSON.parse(readFileSync(
            process.env.RECONCILIATION_PATH,
            "utf8",
          ));
          const files = readdirSync(process.env.RECEIPT_DIRECTORY)
            .filter((file) => /^generic-signer-probe-[0-9a-f]{14}\.json$/u.test(file))
            .sort();
          if (files.length !== 2) throw new Error("two probe receipts are required");
          const receiptFiles = files.map((file) => {
            const bytes = readFileSync(`${process.env.RECEIPT_DIRECTORY}/${file}`);
            return { bytes, receipt: JSON.parse(bytes.toString("utf8")) };
          });
          const probeReceipts = receiptFiles.map(({ bytes, receipt }) => ({
            targetMachineId: receipt.targetMachineId,
            sha256: sha256(bytes),
          }));
          if (probeReceipts.map(({ targetMachineId }) => targetMachineId)
            .join("\n") !== [...expected.machineIds].sort().join("\n")) {
            throw new Error("probe receipt Machine set differs");
          }
          const probeOrigin = process.env.PROBE_TARGET_URL.replace(/\/$/u, "");
          if (reconciliation.schemaVersion !==
              "programmable.website-generic-launch-read-stage-probe-reconciliation.v1"
            || reconciliation.status !== "clean"
            || reconciliation.recoveryId !== process.env.RECOVERY_ID
            || reconciliation.websiteHead !== process.env.GITHUB_SHA
            || reconciliation.projectId !== process.env.VERCEL_PROJECT_ID
            || reconciliation.providerListAbsent !== true
            || reconciliation.matchedDeployments?.length !== 1
            || reconciliation.deletion?.length !== 1
            || reconciliation.matchedDeployments[0].id !==
              process.env.PROBE_DEPLOYMENT_ID
            || reconciliation.matchedDeployments[0].origin !== probeOrigin
            || reconciliation.deletion[0].deploymentId !==
              process.env.PROBE_DEPLOYMENT_ID
            || reconciliation.deletion[0].origin !== probeOrigin
            || ![200, 204].includes(
              reconciliation.deletion[0].providerDeleteStatus,
            )
            || reconciliation.deletion[0].providerGetAfterStatus !== 404
            || ![404, 410].includes(
              reconciliation.deletion[0].publicOriginStatus,
            )) {
            throw new Error("probe reconciliation is not exact and complete");
          }
          if (!/^[1-9][0-9]{0,19}$/u.test(
            process.env.OPERATION_RECORD_ARTIFACT_ID ?? "",
          )
            || !/^sha256:[0-9a-f]{64}$/u.test(
              process.env.OPERATION_RECORD_ARTIFACT_DIGEST ?? "",
            )
            || !/^sha256:[0-9a-f]{64}$/u.test(
              process.env.OPERATION_RECORD_SHA256 ?? "",
            )) {
            throw new Error("pre-mutation operation record binding is invalid");
          }
          const cleanup = {
            schemaVersion:
              "programmable.website-generic-launch-read-stage-probe-cleanup.v1",
            status: "clean",
            operationId: expected.operationId,
            recoveryId: process.env.RECOVERY_ID,
            sourceCommit: expected.sourceCommit,
            sourceTree: expected.sourceTree,
            projectId: process.env.VERCEL_PROJECT_ID,
            operationRecord: {
              artifactId: process.env.OPERATION_RECORD_ARTIFACT_ID,
              artifactDigest: process.env.OPERATION_RECORD_ARTIFACT_DIGEST,
              sha256: process.env.OPERATION_RECORD_SHA256,
            },
            probeDeployment: {
              deploymentId: process.env.PROBE_DEPLOYMENT_ID,
              origin: probeOrigin,
              gitCommitSha: process.env.GITHUB_SHA,
            },
            probeReceipts,
            reconciliation,
            cleanDeployment: {
              deploymentId: process.env.CLEAN_DEPLOYMENT_ID,
              origin: process.env.CLEAN_TARGET_URL.replace(/\/$/u, ""),
              gitCommitSha: process.env.GITHUB_SHA,
              probeRouteStatus: Number(process.env.CLEAN_ROUTE_STATUS),
              probeRouteCode: process.env.CLEAN_ROUTE_CODE,
              observedAt: process.env.CLEAN_OBSERVED_AT,
            },
            workflowAuthority: {
              repositoryId: "1314365508",
              workflowPath: ".github/workflows/deploy-production.yml",
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              environment: "production",
              headSha: process.env.GITHUB_SHA,
            },
          };
          if (cleanup.probeDeployment.deploymentId ===
              cleanup.cleanDeployment.deploymentId
            || cleanup.probeDeployment.origin === cleanup.cleanDeployment.origin) {
            throw new Error("clean deployment is not distinct from probe deployment");
          }
          const bundle = {
            schemaVersion:
              "programmable.website-generic-launch-read-stage-probe-bundle.v1",
            operationId: expected.operationId,
            sourceCommit: expected.sourceCommit,
            sourceTree: expected.sourceTree,
            probeReceipts: receiptFiles.map(({ receipt }) => receipt),
            cleanup,
          };
          const bytes = Buffer.from(`${canonical(bundle)}\n`, "utf8");
          writeFileSync(process.env.BUNDLE_PATH, bytes, { flag: "wx", mode: 0o600 });
          process.stdout.write(`bundle_sha256=${sha256(bytes)}\n`);
          NODE
          echo "bundle_path=$bundle_path" >> "$GITHUB_OUTPUT"

      - name: Attest canonical Generic signer probe cleanup bundle
        id: attest-generic-signer-probe-bundle
        if: steps.generic-signer-probe-bundle.outcome == 'success'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.generic-signer-probe-bundle.outputs.bundle_path }}
          create-storage-record: false

      - name: Preserve canonical Generic signer probe cleanup bundle
        if: steps.generic-signer-probe-bundle.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generic-signer-probe-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.generic-signer-probe-bundle.outputs.bundle_path }}
            ${{ steps.attest-generic-signer-probe-bundle.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Gate exact staged Custom Launch candidate
        id: custom-launch-canary
        if: steps.custom-launch-policy.outputs.staging_mode == 'enabled'
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_RELEASE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_REVIEW_AUTHORITY_MODE: ${{ steps.custom-launch-record.outputs.review_authority_mode }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_ACCESS_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_ACCESS_TOKEN }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_IDENTITY_TOKEN: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_IDENTITY_TOKEN }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_EXPECTED_GITHUB_USER_ID: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_EXPECTED_GITHUB_USER_ID }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_OWN_APPLICATION_HANDLE: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_OWN_APPLICATION_HANDLE }}
          PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_FOREIGN_APPLICATION_HANDLE: ${{ secrets.PROGRAMMABLE_CUSTOM_LAUNCH_CANARY_FOREIGN_APPLICATION_HANDLE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          deployment_host="$(node --input-type=module -e '
            const url = new URL(process.env.STAGED_TARGET_URL);
            if (
              url.protocol !== "https:" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== "" ||
              !url.hostname.endsWith(".vercel.app")
            ) throw new Error("Custom Launch canary target is not an immutable Vercel origin");
            process.stdout.write(url.host);
          ')"
          export PROGRAMMABLE_RELEASE_EXPECTED_DEPLOYMENT_HOST="$deployment_host"
          npm run probe:custom-launch -- \
            "--base-url=$STAGED_TARGET_URL" \
            "--deployment-id=$STAGED_DEPLOYMENT_ID" \
            "--evidence-output=$RUNNER_TEMP/custom-launch-candidate-canary-evidence.json" \
            --require-enabled \
            --authenticated-canary
          echo "evidence_path=$RUNNER_TEMP/custom-launch-candidate-canary-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted Custom Launch candidate evidence
        if: steps.custom-launch-policy.outputs.staging_mode == 'enabled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-candidate-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-canary.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Gate exact staged dark Custom Launch candidate
        id: custom-launch-dark-release
        if: steps.custom-launch-policy.outputs.staging_mode == 'dark'
        env:
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          PROGRAMMABLE_RELEASE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH: ${{ secrets.PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_PACKAGE_ARTIFACT_HASH }}
          PROGRAMMABLE_APPROVAL_SERVICE_EXPECTED_REVIEW_AUTHORITY_MODE: ${{ steps.custom-launch-record.outputs.review_authority_mode }}
          RELEASE_SUBJECT_SHA256: ${{ steps.custom-launch-record.outputs.release_subject_sha256 }}
          DETACHED_RECORD_SHA256: ${{ steps.custom-launch-record.outputs.detached_record_sha256 }}
          CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA: ${{ steps.custom-launch-record.outputs.cross_repository_attestation_commit_sha }}
          CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256: ${{ steps.custom-launch-record.outputs.cross_repository_binding_document_sha256 }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          deployment_host="$(node --input-type=module -e '
            const url = new URL(process.env.STAGED_TARGET_URL);
            if (
              url.protocol !== "https:" ||
              url.username !== "" ||
              url.password !== "" ||
              url.pathname !== "/" ||
              url.search !== "" ||
              url.hash !== "" ||
              !url.hostname.endsWith(".vercel.app")
            ) throw new Error("Custom Launch dark target is not an immutable Vercel origin");
            process.stdout.write(url.host);
          ')"
          export PROGRAMMABLE_RELEASE_EXPECTED_DEPLOYMENT_HOST="$deployment_host"
          evidence_path="$RUNNER_TEMP/custom-launch-dark-release-evidence.json"
          npm run probe:custom-launch -- \
            "--base-url=$STAGED_TARGET_URL" \
            "--deployment-id=$STAGED_DEPLOYMENT_ID" \
            "--dark-release-evidence-output=$evidence_path" \
            "--release-subject-sha256=$RELEASE_SUBJECT_SHA256" \
            "--detached-record-sha256=$DETACHED_RECORD_SHA256" \
            "--cross-repository-attestation-commit-sha=$CROSS_REPOSITORY_ATTESTATION_COMMIT_SHA" \
            "--cross-repository-binding-document-sha256=$CROSS_REPOSITORY_BINDING_DOCUMENT_SHA256" \
            --require-disabled
          echo "evidence_path=$evidence_path" >> "$GITHUB_OUTPUT"

      - name: Preserve redacted Custom Launch dark release evidence
        if: steps.custom-launch-policy.outputs.staging_mode == 'dark'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-launch-dark-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.custom-launch-dark-release.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Verify staged deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 30 "$DEPLOYMENT_URL/" > /dev/null

      - name: Smoke exact staged legacy Explore API reset
        id: index-reset-smoke
        env:
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/smoke-explore-index-reset-public-apis.mjs

      - name: Smoke exact staged indexed website reads
        id: indexed-website-smoke
        env:
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          VERIFIED_SHA: ${{ needs.release-gate.outputs.verified_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          INDEXED_WEBSITE_POLICY_MODE: ${{ steps.indexed-website-policy.outputs.mode }}
          INDEXED_WEBSITE_EVIDENCE_OUTPUT: ${{ runner.temp }}/indexed-website-read-evidence.json
        run: npm run smoke:indexed-website-reads

      - name: Preserve exact indexed website read evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexed-website-reads-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.indexed-website-smoke.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Reverify staged candidate binding
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
        run: |
          binding_output="$RUNNER_TEMP/final-staged-binding"
          test ! -e "$binding_output"
          npm run perf:read-model:staged-deployment -- \
            --target-url "$STAGED_TARGET_URL" \
            --github-output "$binding_output"
          grep -Fx "deployment_id=$EXPECTED_DEPLOYMENT_ID" "$binding_output"
          grep -Fx "target_url=$STAGED_TARGET_URL" "$binding_output"

      - name: Bind exact candidate to stable protected preview
        id: stable-preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          EXPECTED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          STABLE_PREVIEW_HOST: launcher-v4-aficialais-projects.vercel.app
          VERCEL_SCOPE: aficialais-projects
        run: |
          set -euo pipefail
          test "$STABLE_PREVIEW_HOST" = launcher-v4-aficialais-projects.vercel.app
          test "$STABLE_PREVIEW_HOST" != programmable.market
          test "$VERCEL_SCOPE" = aficialais-projects
          vercel alias set "$EXPECTED_DEPLOYMENT_ID" "$STABLE_PREVIEW_HOST" \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN"
          inspect_output="$RUNNER_TEMP/stable-preview-inspect.json"
          test ! -e "$inspect_output"
          umask 077
          vercel inspect "$STABLE_PREVIEW_HOST" --format=json \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" > "$inspect_output"
          INSPECT_OUTPUT="$inspect_output" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const expectedTarget = new URL(process.env.EXPECTED_TARGET_URL);
          const inspected = JSON.parse(
            readFileSync(process.env.INSPECT_OUTPUT, "utf8"),
          );
          if (
            expectedTarget.protocol !== "https:" ||
            expectedTarget.pathname !== "/" ||
            !expectedTarget.hostname.endsWith(".vercel.app") ||
            inspected.id !== process.env.EXPECTED_DEPLOYMENT_ID ||
            inspected.url !== expectedTarget.hostname ||
            inspected.readyState !== "READY"
          ) {
            throw new Error(
              "stable preview alias is not bound to the exact staged deployment",
            );
          }
          NODE
          echo "stable_preview_url=https://$STABLE_PREVIEW_HOST/" >> "$GITHUB_OUTPUT"

      - name: Record staged candidate handoff
        env:
          DEPLOYMENT_ID: ${{ steps.staged-deployment.outputs.deployment_id }}
          STAGED_TARGET_URL: ${{ steps.staged-deployment.outputs.target_url }}
          STABLE_PREVIEW_URL: ${{ steps.stable-preview.outputs.stable_preview_url }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.production-before.outputs.deployment_id }}
          PREVIOUS_DEPLOYMENT_URL: ${{ steps.production-before.outputs.deployment_url }}
          PREVIOUS_GIT_HEAD: ${{ steps.production-before.outputs.git_head }}
          READ_MODEL_POLICY_MODE: ${{ steps.read-model-policy.outputs.mode }}
          READ_MODEL_EVIDENCE_REQUIRED: ${{ steps.read-model-policy.outputs.evidence_required }}
          PROVIDER_CREDENTIALS_REQUIRED: ${{ steps.read-model-policy.outputs.provider_credentials_required }}
          INDEXING_STATUS: ${{ steps.index-reset-smoke.outputs.indexing_status }}
          PUBLIC_ROUTES_CHECKED: ${{ steps.index-reset-smoke.outputs.public_routes_checked }}
          RETIRED_OPERATIONS_CHECKED: ${{ steps.index-reset-smoke.outputs.retired_operations_checked }}
          PROVIDER_CALLS_EXPECTED: ${{ steps.index-reset-smoke.outputs.provider_calls_expected }}
          WEBSITE_READ_MODE: ${{ steps.indexed-website-smoke.outputs.mode }}
          WEBSITE_READ_EVIDENCE_SHA256: ${{ steps.indexed-website-smoke.outputs.evidence_sha256 }}
          ETHEREUM_READ_STATUS: ${{ steps.indexed-website-smoke.outputs.ethereum_status }}
          ETHEREUM_READ_COUNT: ${{ steps.indexed-website-smoke.outputs.ethereum_count }}
          ROBINHOOD_READ_STATUS: ${{ steps.indexed-website-smoke.outputs.robinhood_status }}
          ROBINHOOD_READ_COUNT: ${{ steps.indexed-website-smoke.outputs.robinhood_count }}
          CUSTOM_V2_REQUIRED: ${{ needs.release-gate.outputs.verified_custom_v2 }}
          CUSTOM_LAUNCH_V3_RELEASE: ${{ inputs.custom_launch_v3_release }}
        run: |
          {
            echo "## Staged production candidate"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Deployment ID: \`$DEPLOYMENT_ID\`"
            echo "- Target: $STAGED_TARGET_URL"
            echo "- Stable protected preview: $STABLE_PREVIEW_URL"
            echo "- Previous production deployment: \`$PREVIOUS_DEPLOYMENT_ID\`"
            echo "- Previous production deployment URL: $PREVIOUS_DEPLOYMENT_URL"
            echo "- Previous production commit: \`$PREVIOUS_GIT_HEAD\`"
            echo "- Legacy full-schema API policy mode: \`$READ_MODEL_POLICY_MODE\`"
            echo "- Legacy reset evidence required: \`$READ_MODEL_EVIDENCE_REQUIRED\`"
            echo "- Legacy reset probe provider credentials required: \`$PROVIDER_CREDENTIALS_REQUIRED\`"
            echo "- Legacy Explore API indexing status: \`$INDEXING_STATUS\`"
            echo "- Public reset routes checked: \`$PUBLIC_ROUTES_CHECKED\`"
            echo "- Retired operations checked: \`$RETIRED_OPERATIONS_CHECKED\`"
            echo "- Expected external indexing calls from legacy reset probes: \`$PROVIDER_CALLS_EXPECTED\`"
            echo "- Website read mode: \`$WEBSITE_READ_MODE\`"
            echo "- Indexed website read evidence: \`$WEBSITE_READ_EVIDENCE_SHA256\`"
            echo "- Ethereum website catalog: \`$ETHEREUM_READ_STATUS\`, $ETHEREUM_READ_COUNT verified launch identities"
            echo "- Robinhood website catalog: \`$ROBINHOOD_READ_STATUS\`, $ROBINHOOD_READ_COUNT verified launch identities"
            echo "- Website read scope: catalog source/checkpoint observations and token pages without application authentication"
            echo "- Website reads retain current and last-known-good source states; this is not market, trading or worker activation evidence"
            echo "- Custom V2 verification required by this commit: \`$CUSTOM_V2_REQUIRED\`"
            if [ "$CUSTOM_V2_REQUIRED" = true ]; then
              echo "- Custom V2 evidence: \`${{ steps.custom-v2-stage.outputs.evidence_sha256 }}\`"
            fi
            if [ "$CUSTOM_LAUNCH_V3_RELEASE" = true ]; then
              echo "- Custom Launch V3 release subject: \`${{ steps.custom-launch-v3-record.outputs.release_subject_sha256 }}\`"
              echo "- Custom Launch API image: \`${{ steps.custom-launch-v3-record.outputs.api_image_digest }}\`"
              echo "- Custom Launch V3 read-only stage evidence: \`${{ steps.custom-launch-v3-stage.outputs.evidence_sha256 }}\`"
              echo "- Safety: no wallet signature and no transaction broadcast"
            fi
            echo
            echo "Stage-only: no production promotion was attempted."
            echo "Before any separately authorized promotion, reverify this exact staged deployment ID and commit binding."
          } >> "$GITHUB_STEP_SUMMARY"

  generic-signer-probe-reconcile:
    name: Reconcile one-shot Generic signer probe authority
    needs: [release-gate, deploy]
    if: >-
      always() &&
      github.repository_id == 1314365508 &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/production' &&
      needs.release-gate.result == 'success' &&
      needs.release-gate.outputs.verified_sha == github.sha &&
      needs.release-gate.outputs.verified_custom_v2 == 'true' &&
      inputs.custom_v2_generic_public_read_enabled
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out exact production cleanup source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release-gate.outputs.verified_sha }}
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0

      - name: Independently rederive exact probe recovery identity
        id: recovery-identity
        env:
          EXPECTED_JSON: ${{ inputs.custom_v2_generic_signer_probe_expected_json }}
          EXPECTED_SHA256: ${{ inputs.custom_v2_generic_signer_probe_expected_sha256 }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { appendFileSync } from "node:fs";
          const canonical = (value) => {
            if (value === null || ["boolean", "number", "string"].includes(typeof value)) {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
            return `{${Object.keys(value).sort().map((key) =>
              `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
          };
          const source = (process.env.EXPECTED_JSON ?? "").trim();
          const value = JSON.parse(source);
          const digest = `sha256:${createHash("sha256")
            .update(source, "utf8").digest("hex")}`;
          if (source !== canonical(value)
            || digest !== process.env.EXPECTED_SHA256
            || value.schemaVersion !==
              "programmable.website-generic-launch-read-stage-probe-expected.v1"
            || !/^[0-9a-f]{32}$/u.test(value.operationId ?? "")
            || !/^[0-9]{1,20}$/u.test(process.env.GITHUB_RUN_ID ?? "")
            || !/^[1-9][0-9]{0,5}$/u.test(process.env.GITHUB_RUN_ATTEMPT ?? "")
            || !/^[0-9a-f]{40}$/u.test(process.env.GITHUB_SHA ?? "")) {
            throw new Error("probe recovery identity cannot be rederived");
          }
          const recoveryId = [
            value.operationId,
            process.env.GITHUB_RUN_ID,
            process.env.GITHUB_RUN_ATTEMPT,
            process.env.GITHUB_SHA,
          ].join(".");
          appendFileSync(process.env.GITHUB_OUTPUT, `recovery_id=${recoveryId}\n`);
          NODE

      - name: Delete every residual exact probe deployment and prove absence
        id: reconcile
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROBE_RECOVERY_ID: ${{ steps.recovery-identity.outputs.recovery_id }}
        run: >-
          node scripts/reconcile-generic-signer-probe-deployments.mjs
          --recovery-id "$PROBE_RECOVERY_ID"
          --website-head "$GITHUB_SHA"
          --output "$RUNNER_TEMP/generic-signer-probe-reconciliation-backstop.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve cancellation-safe probe reconciliation
        if: steps.reconcile.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generic-signer-probe-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.reconcile.outputs.reconciliation_path }}
          if-no-files-found: error
          retention-days: 90
